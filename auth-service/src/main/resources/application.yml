server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:mysql://localhost:3306/hcmcyu_auth_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

auth:
  internal:
    secret: ${AUTH_INTERNAL_SECRET:dev-internal-secret}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  jwt:
    secret: ${AUTH_JWT_SECRET:dev-only-hcmcyu-auth-service-secret-key-change-me-please-32}
    access-token-expiration-ms: ${AUTH_ACCESS_TOKEN_EXPIRATION_MS:900000}
    refresh-token-expiration-ms: ${AUTH_REFRESH_TOKEN_EXPIRATION_MS:604800000}

services:
  member:
    url: ${MEMBER_SERVICE_URL:http://localhost:8082}

---
spring:
  config:
    activate:
      on-profile: dev

auth:
  seed:
    ward-secretary:
      enabled: true
      username: ${DEV_WARD_SECRETARY_USERNAME:ward.secretary}
      email: ${DEV_WARD_SECRETARY_EMAIL:ward.secretary@hcmcyu.local}
      password: ${DEV_WARD_SECRETARY_PASSWORD:ChangeMe123!}
