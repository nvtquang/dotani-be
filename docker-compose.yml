services:
  mysql:
    image: mysql:8.4
    container_name: dotani-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dotani_db}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - dotani_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dotani-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-dotani_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET is required}
      AUTH_INTERNAL_SECRET: ${AUTH_INTERNAL_SECRET:?AUTH_INTERNAL_SECRET is required}
      AUDIT_INTERNAL_SECRET: ${AUDIT_INTERNAL_SECRET:?AUDIT_INTERNAL_SECRET is required}
      NOTIFICATION_INTERNAL_SECRET: ${NOTIFICATION_INTERNAL_SECRET:?NOTIFICATION_INTERNAL_SECRET is required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:*,http://127.0.0.1:*}
      AVATAR_STORAGE_PATH: /app/storage/avatars
      BANK_QR_STORAGE_PATH: /app/storage/bank-qr
      POST_IMAGE_STORAGE_PATH: /app/storage/post-images
      STORAGE_CHAT_ATTACHMENT_PATH: /app/storage/chat-attachments
      STORAGE_CHAT_GROUP_AVATAR_PATH: /app/storage/chat-group-avatars
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75.0}
      DEV_WARD_SECRETARY_USERNAME: ${DEV_WARD_SECRETARY_USERNAME:-ward.secretary}
      DEV_WARD_SECRETARY_EMAIL: ${DEV_WARD_SECRETARY_EMAIL:-ward.secretary@hcmcyu.local}
      DEV_WARD_SECRETARY_PASSWORD: ${DEV_WARD_SECRETARY_PASSWORD:-ChangeMe123!}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - dotani_storage:/app/storage
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s

volumes:
  dotani_mysql_data:
  dotani_storage:
