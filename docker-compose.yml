services:
  mysql:
    image: mysql:8.4
    container_name: hcmcyu-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - hcmcyu_mysql_data:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  audit-service:
    build:
      context: .
      dockerfile: audit-service/Dockerfile
      args:
        MODULE: audit-service
    container_name: hcmcyu-audit-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:mysql://mysql:3306/hcmcyu_audit_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      AUDIT_INTERNAL_SECRET: ${AUDIT_INTERNAL_SECRET:?AUDIT_INTERNAL_SECRET is required}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8087/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
      args:
        MODULE: auth-service
    container_name: hcmcyu-auth-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker,dev
      DB_URL: jdbc:mysql://mysql:3306/hcmcyu_auth_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET is required}
      AUTH_INTERNAL_SECRET: ${AUTH_INTERNAL_SECRET:?AUTH_INTERNAL_SECRET is required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      MEMBER_SERVICE_URL: http://member-service:8082
      DEV_WARD_SECRETARY_USERNAME: ${DEV_WARD_SECRETARY_USERNAME:-ward.secretary}
      DEV_WARD_SECRETARY_EMAIL: ${DEV_WARD_SECRETARY_EMAIL:-ward.secretary@hcmcyu.local}
      DEV_WARD_SECRETARY_PASSWORD: ${DEV_WARD_SECRETARY_PASSWORD:?DEV_WARD_SECRETARY_PASSWORD is required}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s

  member-service:
    build:
      context: .
      dockerfile: member-service/Dockerfile
      args:
        MODULE: member-service
    container_name: hcmcyu-member-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker,dev
      DB_URL: jdbc:mysql://mysql:3306/hcmcyu_member_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      AUTH_SERVICE_URL: http://auth-service:8081
      AUTH_INTERNAL_SECRET: ${AUTH_INTERNAL_SECRET:?AUTH_INTERNAL_SECRET is required}
      AUDIT_SERVICE_URL: http://audit-service:8087
      AUDIT_INTERNAL_SECRET: ${AUDIT_INTERNAL_SECRET:?AUDIT_INTERNAL_SECRET is required}
      AVATAR_STORAGE_PATH: /app/storage/avatars
      BANK_QR_STORAGE_PATH: /app/storage/bank-qr
      AVATAR_PUBLIC_URL_PREFIX: /uploads/avatars
      BANK_QR_PUBLIC_URL_PREFIX: /uploads/bank-qr
    depends_on:
      mysql:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      audit-service:
        condition: service_healthy
    volumes:
      - hcmcyu_member_storage:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s

  event-service:
    build:
      context: .
      dockerfile: event-service/Dockerfile
      args:
        MODULE: event-service
    container_name: hcmcyu-event-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker,dev
      DB_URL: jdbc:mysql://mysql:3306/hcmcyu_event_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      AUDIT_SERVICE_URL: http://audit-service:8087
      AUDIT_INTERNAL_SECRET: ${AUDIT_INTERNAL_SECRET:?AUDIT_INTERNAL_SECRET is required}
    depends_on:
      mysql:
        condition: service_healthy
      audit-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s

  content-service:
    build:
      context: .
      dockerfile: content-service/Dockerfile
      args:
        MODULE: content-service
    container_name: hcmcyu-content-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker,dev
      DB_URL: jdbc:mysql://mysql:3306/hcmcyu_content_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      AUDIT_SERVICE_URL: http://audit-service:8087
      AUDIT_INTERNAL_SECRET: ${AUDIT_INTERNAL_SECRET:?AUDIT_INTERNAL_SECRET is required}
      POST_IMAGE_STORAGE_PATH: /app/storage/post-images
      POST_IMAGE_PUBLIC_URL_PREFIX: /uploads/post-images
    depends_on:
      mysql:
        condition: service_healthy
      audit-service:
        condition: service_healthy
    volumes:
      - hcmcyu_content_storage:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8084/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s

  chat-service:
    build:
      context: .
      dockerfile: chat-service/Dockerfile
      args:
        MODULE: chat-service
    container_name: hcmcyu-chat-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker,dev
      DB_URL: jdbc:mysql://mysql:3306/hcmcyu_chat_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET is required}
      MEMBER_SERVICE_URL: http://member-service:8082
      AUTH_INTERNAL_SECRET: ${AUTH_INTERNAL_SECRET:?AUTH_INTERNAL_SECRET is required}
      STORAGE_CHAT_ATTACHMENT_PATH: /app/storage/chat-attachments
      STORAGE_CHAT_GROUP_AVATAR_PATH: /app/storage/chat-group-avatars
    depends_on:
      mysql:
        condition: service_healthy
      member-service:
        condition: service_healthy
    volumes:
      - hcmcyu_chat_storage:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8085/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
      args:
        MODULE: notification-service
    container_name: hcmcyu-notification-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker,dev
      DB_URL: jdbc:mysql://mysql:3306/hcmcyu_notification_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET is required}
      NOTIFICATION_INTERNAL_SECRET: ${NOTIFICATION_INTERNAL_SECRET:?NOTIFICATION_INTERNAL_SECRET is required}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8086/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
      args:
        MODULE: api-gateway
    container_name: hcmcyu-api-gateway
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET is required}
      AUTH_SERVICE_URL: http://auth-service:8081
      MEMBER_SERVICE_URL: http://member-service:8082
      EVENT_SERVICE_URL: http://event-service:8083
      CONTENT_SERVICE_URL: http://content-service:8084
      CHAT_SERVICE_URL: http://chat-service:8085
      CHAT_SERVICE_WS_URL: ws://chat-service:8085
      NOTIFICATION_SERVICE_URL: http://notification-service:8086
      AUDIT_SERVICE_URL: http://audit-service:8087
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    depends_on:
      auth-service:
        condition: service_healthy
      member-service:
        condition: service_healthy
      event-service:
        condition: service_healthy
      content-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      audit-service:
        condition: service_healthy
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: ../HCMCYU-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
        VITE_CHAT_WS_URL: ${VITE_CHAT_WS_URL:-ws://localhost:8080/ws/chat}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    container_name: hcmcyu-frontend
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  hcmcyu_mysql_data:
  hcmcyu_member_storage:
  hcmcyu_content_storage:
  hcmcyu_chat_storage:
