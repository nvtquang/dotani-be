server:
  port: ${PORT:8086}

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:mysql://localhost:3306/hcmcyu_notification_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

auth:
  jwt:
    secret: ${JWT_SECRET:dev-hcmcyu-notification-service-secret-key-change-me-please-32}

notification:
  internal:
    secret: ${NOTIFICATION_INTERNAL_SECRET:dev-notification-internal-secret}

management:
  endpoints:
    web:
      exposure:
        include: health
