server:
  port: ${PORT:8083}

spring:
  application:
    name: event-service
  datasource:
    url: jdbc:mysql://localhost:3306/hcmcyu_event_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

audit:
  service:
    url: ${AUDIT_SERVICE_URL:http://localhost:8087}
  internal:
    secret: ${AUDIT_INTERNAL_SECRET:dev-audit-internal-secret}

management:
  endpoints:
    web:
      exposure:
        include: health
