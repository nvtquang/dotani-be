server:
  port: 8085

spring:
  application:
    name: chat-service
  datasource:
    url: jdbc:mysql://localhost:3306/hcmcyu_chat_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

auth:
  jwt:
    secret: ${JWT_SECRET:dev-hcmcyu-chat-service-secret-key-change-me-please-32}

services:
  member:
    url: ${MEMBER_SERVICE_URL:http://localhost:8082}
    internal-secret: ${AUTH_INTERNAL_SECRET:dev-internal-secret}

management:
  endpoints:
    web:
      exposure:
        include: health,info
