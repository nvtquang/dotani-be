spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}

auth:
  jwt:
    secret: ${JWT_SECRET}

services:
  member:
    url: ${MEMBER_SERVICE_URL}
    internal-secret: ${AUTH_INTERNAL_SECRET}

app:
  cors:
    allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGINS}
