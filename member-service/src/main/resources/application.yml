server:
  port: ${PORT:8082}

spring:
  application:
    name: member-service
  datasource:
    url: jdbc:mysql://localhost:3306/hcmcyu_member_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

services:
  auth:
    url: ${AUTH_SERVICE_URL:http://localhost:8081}
    internal-secret: ${AUTH_INTERNAL_SECRET:dev-internal-secret}

storage:
  local:
    avatar-path: ${AVATAR_STORAGE_PATH:storage/avatars}
    bank-qr-path: ${BANK_QR_STORAGE_PATH:storage/bank-qr}
  public-url-prefix: ${AVATAR_PUBLIC_URL_PREFIX:/uploads/avatars}
  bank-qr-public-url-prefix: ${BANK_QR_PUBLIC_URL_PREFIX:/uploads/bank-qr}
  avatar:
    max-size-bytes: ${AVATAR_MAX_SIZE_BYTES:2097152}
  bank-qr:
    max-size-bytes: ${BANK_QR_MAX_SIZE_BYTES:2097152}

audit:
  service:
    url: ${AUDIT_SERVICE_URL:http://localhost:8087}
  internal:
    secret: ${AUDIT_INTERNAL_SECRET:dev-audit-internal-secret}

management:
  endpoints:
    web:
      exposure:
        include: health
