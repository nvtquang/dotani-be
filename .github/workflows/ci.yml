name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Build and test (mvn verify)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Integration tests run against a real MySQL, same engine as production.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: dotani_test
          MYSQL_USER: dotani_test
          MYSQL_PASSWORD: dotani_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    env:
      TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/dotani_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      TEST_DB_USERNAME: dotani_test
      TEST_DB_PASSWORD: dotani_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Phase2MigrationTest rebuilds the schema in its own database.
      - name: Create migration test database
        run: >-
          mysql -h 127.0.0.1 -uroot -proot -e
          "CREATE DATABASE IF NOT EXISTS dotani_migration_test;
          GRANT ALL PRIVILEGES ON dotani_migration_test.* TO 'dotani_test'@'%';"

      - name: mvn verify
        run: mvn -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: dotani-monolith/target/surefire-reports
