# Production profile (SPRING_PROFILES_ACTIVE=prod).
# Secrets and database settings have NO defaults here: if a variable is missing, startup fails with
# "Could not resolve placeholder ..." instead of silently running with a development value.
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}
  jpa:
    hibernate:
      ddl-auto: validate

auth:
  jwt:
    secret: ${AUTH_JWT_SECRET}

app:
  frontend-url: ${FRONTEND_URL}
  mail:
    log-links-when-unconfigured: false
  security:
    field-encryption-key: ${FIELD_ENCRYPTION_KEY}
  cors:
    allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGINS}

# API docs are off in production unless explicitly enabled.
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}
