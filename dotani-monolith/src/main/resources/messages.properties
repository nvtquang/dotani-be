error.MEMBER_NOT_FOUND=Không tìm thấy đoàn viên.
error.DUPLICATE_MEMBER_USER_ID=Tài khoản này đã gắn với một hồ sơ đoàn viên khác.
error.INVALID_MEMBER_ORGANIZATION=Đoàn viên phải thuộc một chi đoàn (tổ dân phố) đang hoạt động.
error.INVALID_ROLE_ORGANIZATION=Chức vụ cấp tổ dân phố chỉ áp dụng cho đoàn viên thuộc chi đoàn.
error.LAST_WARD_SECRETARY=Không thể bỏ chức vụ của Bí thư phường cuối cùng.
error.ORGANIZATION_NOT_FOUND=Không tìm thấy đơn vị.
