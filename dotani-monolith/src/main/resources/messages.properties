error.BANK_QR_NOT_FOUND=Chưa có ảnh QR ngân hàng.
error.BANK_QR_READ_FAILED=Không đọc được ảnh QR ngân hàng.
error.BANK_QR_STORAGE_FAILED=Không lưu được ảnh QR. Vui lòng thử lại.
error.BANK_QR_DELETE_FAILED=Không xoá được ảnh QR. Vui lòng thử lại.
error.AVATAR_STORAGE_FAILED=Không lưu được ảnh đại diện. Vui lòng thử lại.
error.AVATAR_DELETE_FAILED=Không xoá được ảnh đại diện. Vui lòng thử lại.

