# User-facing (Vietnamese) messages for API error codes: error.<CODE>.
# The code stays stable for programs; the frontend can show "message" as is.

# --- authentication / accounts
error.UNAUTHORIZED=Bạn cần đăng nhập để tiếp tục.
error.TOKEN_EXPIRED=Phiên đăng nhập đã hết hạn. Vui lòng đăng nhập lại.
error.INVALID_TOKEN=Phiên đăng nhập không hợp lệ. Vui lòng đăng nhập lại.
error.INVALID_REFRESH_TOKEN=Phiên đăng nhập đã kết thúc. Vui lòng đăng nhập lại.
error.INVALID_CREDENTIALS=Tên đăng nhập/email hoặc mật khẩu không đúng.
error.ACCOUNT_LOCKED=Tài khoản tạm khoá do đăng nhập sai quá nhiều lần. Vui lòng thử lại sau {0} phút.
error.ACCOUNT_NOT_LINKED=Tài khoản chưa gắn với hồ sơ đoàn viên hoặc hồ sơ đã bị xoá.
error.MEMBER_CONTEXT_REQUIRED=Tài khoản chưa gắn với hồ sơ đoàn viên.
error.DUPLICATE_USERNAME=Tên đăng nhập đã được sử dụng.
error.DUPLICATE_EMAIL=Email đã được sử dụng cho tài khoản khác.
error.WEAK_PASSWORD=Mật khẩu phải dài 8-100 ký tự và có cả chữ lẫn số.
error.INVALID_CURRENT_PASSWORD=Mật khẩu hiện tại không đúng.
error.INVALID_RESET_TOKEN=Liên kết đặt lại mật khẩu không hợp lệ hoặc đã hết hạn.
error.INVALID_GOOGLE_TOKEN=Không xác thực được tài khoản Google.
error.GOOGLE_LOGIN_NOT_CONFIGURED=Đăng nhập bằng Google chưa được bật.
error.USER_NOT_FOUND=Không tìm thấy tài khoản.
error.USER_ACCOUNT_NOT_FOUND=Không có tài khoản đăng nhập nào với mã này.
error.RATE_LIMITED=Bạn thao tác quá nhanh. Vui lòng thử lại sau ít phút.

# --- permissions
error.FORBIDDEN=Bạn không có quyền thực hiện thao tác này.
error.ACCESS_DENIED=Chỉ cán bộ cấp phường được thực hiện thao tác này.
error.OUT_OF_SCOPE=Dữ liệu này nằm ngoài phạm vi đơn vị của bạn.
error.ROLE_UPDATE_FORBIDDEN=Chỉ Bí thư phường được thay đổi chức vụ.
error.AUDIT_LOG_FORBIDDEN=Chỉ cán bộ cấp phường được xem nhật ký hệ thống.

