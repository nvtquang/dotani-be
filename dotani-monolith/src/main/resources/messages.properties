error.INVALID_MEMBER_ORGANIZATION=Đoàn viên phải thuộc một chi đoàn (tổ dân phố) đang hoạt động.
error.INVALID_ROLE_ORGANIZATION=Chức vụ cấp tổ dân phố chỉ áp dụng cho đoàn viên thuộc chi đoàn.
