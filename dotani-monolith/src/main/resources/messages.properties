error.ORGANIZATION_HAS_MEMBERS=Không thể xoá tổ dân phố đang có đoàn viên.
error.INVALID_AVATAR_FILE=Ảnh đại diện phải là tệp jpg, jpeg, png hoặc webp.
error.AVATAR_TOO_LARGE=Ảnh đại diện vượt quá dung lượng cho phép.
