server:
  port: ${PORT:8084}

spring:
  application:
    name: content-service
  datasource:
    url: jdbc:mysql://localhost:3306/hcmcyu_content_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

storage:
  local:
    post-image-path: ${POST_IMAGE_STORAGE_PATH:storage/post-images}
  post-image-public-url-prefix: ${POST_IMAGE_PUBLIC_URL_PREFIX:/uploads/post-images}
  post-image:
    max-size-bytes: ${POST_IMAGE_MAX_SIZE_BYTES:5242880}

audit:
  service:
    url: ${AUDIT_SERVICE_URL:http://localhost:8087}
  internal:
    secret: ${AUDIT_INTERNAL_SECRET:dev-audit-internal-secret}

management:
  endpoints:
    web:
      exposure:
        include: health
